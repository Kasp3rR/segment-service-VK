name: segment-service-vk
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: segments
      POSTGRES_USER: segments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-segments_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segments -d segments"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-segment-distributions}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$KAFKA_TOPIC" --partitions 4 --replication-factor 1
  api:
    build: .
    environment:
      DATABASE_URL: postgres://segments:${POSTGRES_PASSWORD:-segments_local}@postgres:5432/segments?sslmode=disable
      HTTP_ADDR: :8080
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://segments:${POSTGRES_PASSWORD:-segments_local}@postgres:5432/segments?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-segment-distributions}
      KAFKA_GROUP: ${KAFKA_GROUP:-segment-service}
      WORKER_HTTP_ADDR: :8082
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-250ms}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-15s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  postgres_data:
  kafka_data:
